# THESIS FEATURE SET COMPARISON EXPERIMENTS CONFIGURATION
# 
# USAGE:
# python watchdog_ai/manage.py thesis_feature_comparison --config "1 Thesis/features/research_model/thesis_config.yml"
#
# This configuration runs controlled experiments to compare different feature sets.

# Data source configuration
data_source:
  training_csv_path: D:\Projects\WatchdogAI\data\training\training_data\21_0.05\labeled\training.csv
  evaluation_csv_path: D:\Projects\WatchdogAI\data\training\training_data\21_0.05\labeled\training.csv
  actual_contamination: 0.05

# Model configuration - same parameters for all experiments
model:
  contamination_range: [0.01, 0.05, 0.10, 0.15, 0.20]
  n_estimators: 100
  random_state: 42
  max_samples: 700
  bootstrap: false
  n_jobs: null
  verbose: 0
  warm_start: false
  max_features: 1.0

# Feature sets configuration - each set defines its specific features
feature_sets:
  baseline:
    description: "Raw numerical features only"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "total_purchase_price"
      - "approved_budget"
      - "transaction_date"
      - "project_name"
      - "end_user_unit"
      - "average_price"

    enabled: true

  2_clean_baseline:
    description: "Raw numerical features only"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "total_purchase_price"
      - "approved_budget"
      - "transaction_date"
      - "average_price"
    enabled: true
  
  3_baseline+_initial_financial_features:
    description: "Baseline + Initial Financial features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "total_purchase_price"
      - "approved_budget"
      - "average_price"
      - "price_vs_market_average"

    enabled: true

  4_baseline+_added_financial_features: # Added financial features
    description: "Baseline + Added financial features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "total_purchase_price"
      - "approved_budget"
      - "average_price"
      - "budget_utilization_ratio"
      - "price_competitiveness_score"
      - "total_transaction_value"
    enabled: true

  5_baseline+temporal_features_1:
    description: "Baseline + Temporal features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "total_purchase_price"
      - "approved_budget"
      - "average_price"
      - "transaction_month"
      - "transaction_date"
      - "contract_signing_day_of_week"
    enabled: true

  6_baseline+temporal_features_2:
    description: "Baseline + Temporal features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "average_price"
      - "total_purchase_price"
      - "approved_budget"
      - 'contract_signing_day_of_week'
      - "bidding_period_number_of_days"
      - "award_decision_duration"
      - "contract_signing_number_of_days"
      - "total_procurement_duration"
      - "transaction_month"
      - "transaction_date"
    enabled: true

  7_baseline+temporal_features+supplier:
    description: "Baseline + Temporal features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "average_price"
      - "total_purchase_price"
      - "approved_budget"
      - 'contract_signing_day_of_week'
      - "bidding_period_number_of_days"
      - "award_decision_duration"
      - "contract_signing_number_of_days"
      - "total_procurement_duration"
      - "transaction_month"
      - "transaction_date"
      # supplier
      - "supplier_frequency"
    enabled: true

  8_baseline+temporal_features+enhanced_supplier:
    description: "Baseline + Temporal features"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "average_price"
      - "total_purchase_price"
      - "approved_budget"
      - 'contract_signing_day_of_week'
      - "bidding_period_number_of_days"
      - "award_decision_duration"
      - "contract_signing_number_of_days"
      - "total_procurement_duration"
      - "transaction_month"
      - "transaction_date"
      # supplier
      - "supplier_frequency"
      # enhanced supplier
      - "price_per_supplier_freq"
      - "price_vs_supplier_average"
    enabled: true

  9_baseline+temporal+supplier+efficiency:
      description: "Baseline + Temporal features"
      features:
        - "quantity"
        - "unit_purchase_price"
        - "average_price"
        - "total_purchase_price"
        - "approved_budget"
        - 'contract_signing_day_of_week'
        - "bidding_period_number_of_days"
        - "award_decision_duration"
        - "contract_signing_number_of_days"
        - "total_procurement_duration"
        - "transaction_month"
        - "transaction_date"
        # supplier
        - "supplier_frequency"
        # enhanced supplier
        - "price_per_supplier_freq"
        - "price_vs_supplier_average"
        # Efficiency
        - "quantity_per_peso_ratio"
        - "budget_efficiency_score"
      enabled: true

  10_baseline+temporal+supplier+enhanced_efficiency:
      description: "Baseline + Temporal features"
      features:
        - "quantity"
        - "unit_purchase_price"
        - "average_price"
        - "total_purchase_price"
        - "approved_budget"
        - 'contract_signing_day_of_week'
        - "bidding_period_number_of_days"
        - "award_decision_duration"
        - "contract_signing_number_of_days"
        - "total_procurement_duration"
        - "transaction_month"
        - "transaction_date"
        # supplier
        - "supplier_frequency"
        # enhanced supplier
        - "price_per_supplier_freq"
        - "price_vs_supplier_average"
        # Efficiency
        - "quantity_per_peso_ratio"
        - "budget_efficiency_score"
        - "procurement_timeline_speed_ratio"
        - "transaction_on_a_weekend"
      enabled: true


  11_baseline+financial+temporal+supplier+efficiency:
    description: "included financial compared to 10"
    features:
      - "quantity"
      - "unit_purchase_price"
      - "average_price"
      - "total_purchase_price"
      - "approved_budget"

      # Financial
      - "budget_utilization_ratio"
      - "price_vs_market_average"
      - "price_competitiveness_score"
      - "total_transaction_value"

      # Temporal
      - 'contract_signing_day_of_week'
      - "bidding_period_number_of_days"
      - "award_decision_duration"
      - "contract_signing_number_of_days"
      - "total_procurement_duration"
      - "transaction_month"
      - "transaction_date"
      # supplier
      - "supplier_frequency"
      # enhanced supplier
      - "price_per_supplier_freq"
      - "price_vs_supplier_average"
      # Efficiency
      - "quantity_per_peso_ratio"
      - "budget_efficiency_score"
      - "procurement_timeline_speed_ratio"
      - "transaction_on_a_weekend"
    enabled: true
  
  final_all_engineered:
    description: "dropped irrelevant fields (baseline values), included methods"
    features:

      # Baseline
      - "quantity"
      - "unit_purchase_price"
      - "average_price"
      - "total_purchase_price"
      - "approved_budget"

      # Financial features
      - "price_per_unit_efficiency"
      - "quantity_per_peso_ratio"
      - "unit_price_vs_market_average"
      - "budget_efficiency_score"
      - "price_volatility_index"
      - "total_transaction_value"
      - "budget_utilization_ratio"
      - "price_vs_market_average"
      - "price_competitiveness_score"
      # Date-based features
      - "contract_signing_day_of_week"
      - "bid_opening_day_of_week"
      - "transaction_month"
      - "bidding_period_number_of_days"
      - "award_decision_duration"
      - "contract_signing_number_of_days"
      - "total_procurement_duration"
      # Supplier features
      - "supplier_frequency"
      - "price_per_supplier_freq"
      - "price_vs_supplier_average"
      # Efficiency features
      - "procurement_timeline_speed_ratio"
      - "transaction_on_a_weekend"
      # One-hot encoded features
      - "procurement_method_Competitive Bidding"
      - "procurement_method_Direct Contracting"
      - "procurement_method_Negotiated Procurement (Agency-to-Agency)"
      - "procurement_method_Negotiated Procurement (Small Value Procurement)"
      - "procurement_method_Negotiated Procurement (Two Failed Biddings)"
      - "procurement_method_Repeat Order"
      - "procurement_method_nan"
    enabled: true

# Experiments configuration
experiments:
  metrics: ["precision", "recall", "f1_score"]
  output:
    save_detailed_results: true
    save_best_models: false
    include_confusion_matrices: true
    include_feature_analysis: false

# Thesis-specific output configuration
thesis_output:
  results_directory: "1 Thesis/features/research_model/results"
  include_timestamp: true
  results_filename_format: "thesis_feature_comparison_results_{timestamp}.json"
  save_summary_report: true
  summary_report_filename: "thesis_experiment_summary_{timestamp}.md"

# Logging configuration
logging:
  level: "INFO"
  console_output: true
  file_logging: false
  log_file_path: null

# Advanced configuration
advanced:
  handle_missing_values: true
  missing_value_default: 0
  validate_data: true
  continue_on_feature_error: true
  random_seed: 42
  n_jobs: null 