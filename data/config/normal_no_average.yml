# ----------------------------------------------------------------------------
# CONFIGURATION FOR GENERATING NORMAL (NON-ANOMALOUS) DATA WITHOUT AVERAGE PRICE
# ----------------------------------------------------------------------------
#
# This configuration is designed to generate a dataset containing ONLY NORMAL
# transactions without average_price column. This is useful for training 
# unsupervised models like Isolation Forest, which learn the profile of normal 
# data in order to later identify deviations.
#
# The key is `anomaly_fraction: 0.0`.
#
# ----------------------------------------------------------------------------

data_generator:
  # --- Main Configuration ---
  n_samples: 500
  random_state: 7
  anomaly_fraction: 0.00
  
  # --- Output Configuration ---
  output_folder_path: "data/generated_data_no_avg_price" 
  
  # --- Source for Item Descriptions ---
  item_source_file: "data/lab_equipment.txt"

  # --- Average Price Configuration ---
  # Mode: 'none' - No average_price column will be generated
  average_price:
    mode: 'none'

  # --- Rules for Generating Raw Transaction Fields ---
  field_rules:
    project_name: { 
      type: 'categorical', 
      values: [
        'AghamYaman Labs Project', 'DepEd Lingap Labs Project', 'DepEd Likha-Agham Project',
        'Science Lab Enhancement Program', 'Laboratory Equipment Modernization', 'STEM Lab Development Initiative',
        'Chemistry Lab Upgrade Project', 'Physics Lab Equipment Procurement', 'Biology Lab Enhancement Program',
        'Science Education Modernization', 'Lab Safety Equipment Project', 'Science Equipment Replacement Program',
        'STEM Learning Center Development', 'Laboratory Infrastructure Upgrade', 'Science Lab Renovation Project'
      ] 
    }
    
    end_user_unit: { 
      type: 'categorical', 
      values: [
        'DEPED - Division of City Schools',
        'DEPED - Division of Provincial Schools',
        'DEPED - Science and Technology Education Center',
        'DEPED - Regional Science High School',
        'DEPED - National Science High School',
        'DEPED - Special Science Elementary School',
        'DEPED - Science and Technology School',
        'DEPED - Laboratory School',
        'DEPED - Science Education Center',
        'DEPED - STEM Learning Center'
      ] 
    }
    project_description: { type: 'faker', provider: 'catch_phrase' }
    
    # Note: average_price is NOT included in field_rules when mode is 'none'
    # unit_purchase_price is ALWAYS required as fallback for approved_budget calculation
    
    quantity: { type: 'log-normal', mean: 3, std_dev: 1 }
    unit_purchase_price: { type: 'log-normal', mean: 5.3, std_dev: 0.3 }
    # approved_budget will be calculated as 15-22% above unit_purchase_price (no average_price fallback)

    procurement_method_name: { 
       type: 'categorical', 
       values: [
           'Competitive Bidding', 
           'Negotiated Procurement (Small Value Procurement)', 
           'Negotiated Procurement (Agency-to-Agency)', 
           'Repeat Order', 
           'Negotiated Procurement (Two Failed Biddings)', 
           'Direct Contracting'
       ], 
       weights: [0.66, 0.225, 0.075, 0.03, 0.005, 0.005] 
   }
    
    supplier: { type: 'faker', provider: 'company' }
    
    procurement_officer: { type: 'categorical', values: ['Jodi Marie Sta. Maria', 'Coco Martin Dela Cruz', 'Bea Alonzo Valera', 'Liza Soberano Reyes', 'Carlo Aquino Santos', 'Regine Velasquez Alcasid', 'John Lloyd Cruz Miranda', 'Anne Curtis Smith', 'Piolo Pascual Go', 'Nadine Lustre Panganiban'] }
    
    transaction_date: { type: 'date_range', start_date: '2022-01-01', end_date: '2024-12-31' }

  # --- Anomaly Generation ---
  # This section is ignored when anomaly_fraction is 0.0, so it's left empty.
  active_anomalies: []