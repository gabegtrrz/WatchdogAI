# -------------------------------------------------------------
# CONFIGURATION FOR GENERATING DATA WITH SCRAPED AVERAGE PRICES
# -------------------------------------------------------------
#
# Demonstrates the 'scrape' mode for average_price.
# Scraping runs automatically when no cached prices exist.
#
# -------------------------------------------------------------

data_generator:
  # --- Main Configuration ---
  n_samples: 500
  random_state: 42
  anomaly_fraction: 0.03
  
  # --- Output Configuration ---
  output_folder: "generated_data_scraped_avg_price" 
  
  # --- Source for Item Descriptions ---
  item_source_file: "data/lab_equipment.txt"

  # --- Average Price Configuration ---
  # Mode: 'scrape' - Get average_price from scraped data in ItemAveragePrice model
  # Note: Scraping runs automatically when no cached prices exist
  average_price:
    mode: 'scrape'
    # Unit price variation configuration
    unit_price_variation:
      min_factor: 0.85  # Unit price can be 85% of average price
      max_factor: 1.15  # Unit price can be 115% of average price (default ±15%)

  # --- Rules for Generating Raw Transaction Fields ---
  field_rules:
    project_name: { type: 'categorical', values: ['AghamYaman Labs Project', 'DepEd Lingap Labs Project', 'DepEd Likha-Agham Project'] }
    end_user_unit: { type: 'fixed', value: 'DEPED - Division of City Schools' }
    project_description: { type: 'faker', provider: 'catch_phrase' }
    
    # IMPORTANT: unit_purchase_price MUST be included as fallback for approved_budget calculation
    # average_price is NOT included - will be populated from scraped data
    quantity: { type: 'log-normal', mean: 3, std_dev: 1 }
    unit_purchase_price: { type: 'log-normal', mean: 5.3, std_dev: 0.3 }  # REQUIRED FALLBACK
    # approved_budget will be calculated as 15-22% above average_price (from scraped data) or unit_purchase_price (fallback)

    procurement_method_name: { 
       type: 'categorical', 
       values: [
           'Competitive Bidding', 
           'Negotiated Procurement (Small Value Procurement)', 
           'Negotiated Procurement (Agency-to-Agency)', 
           'Repeat Order', 
           'Negotiated Procurement (Two Failed Biddings)', 
           'Direct Contracting'
       ], 
       weights: [0.66, 0.225, 0.075, 0.03, 0.005, 0.005] 
   }
    
    supplier: { type: 'categorical', values: ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D'], weights: [0.4, 0.3, 0.2, 0.1] }
    
    procurement_officer: { type: 'categorical', values: ['Jodi Marie Sta. Maria', 'Coco Martin Dela Cruz', 'Bea Alonzo Valera', 'Liza Soberano Reyes', 'Carlo Aquino Santos', 'Regine Velasquez Alcasid', 'John Lloyd Cruz Miranda', 'Anne Curtis Smith', 'Piolo Pascual Go', 'Nadine Lustre Panganiban'] }
    
    transaction_date: { type: 'date_range', start_date: '2022-01-01', end_date: '2024-12-31' }

  # --- Anomaly Generation ---
  active_anomalies:
    - "Suspicious Overpricing"
    - "Unusual Bulk Order"
    - "End of Year Rush"
    - "Compressed Timeline"
    - "Weekend Activity"
    - "Insufficient Bidding Period"
    - "Delayed Award Notice"
    - "Premature Contract Signing" 