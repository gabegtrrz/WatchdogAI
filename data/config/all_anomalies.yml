# ----------------------------------------------------------------------------
# CONFIGURATION FOR GENERATING RAW TRANSACTION DATA WITH YAML PRICES
# ----------------------------------------------------------------------------
#
# This configuration demonstrates the 'yaml' mode for average_price.
# Both average_price and unit_purchase_price are defined in field_rules.
#
# ----------------------------------------------------------------------------

data_generator:
  # --- Main Configuration ---
  n_samples: 500
  random_state: 7
  anomaly_fraction: 0.03
  
  # --- Output Configuration ---
  # Defines the sub-folder where the output files will be saved.
  # This folder will be created inside the directory of this config file.
  output_folder: "generated_data" 
  
  # --- Source for Item Descriptions ---
  # Path is relative to the project root.
  item_source_file: "data/lab_equipment.txt"

  # --- Average Price Configuration ---
  # Mode: 'yaml' - Use YAML field_rules to generate average_price (default behavior)
  average_price:
    mode: 'yaml'
    # Unit price variation configuration
    unit_price_variation:
      min_factor: 0.85  # Unit price can be 85% of average price
      max_factor: 1.15  # Unit price can be 115% of average price (default ±15%)

  # --- Rules for Generating Raw Transaction Fields ---
  # These rules map directly to the fields in the Transaction model.
  field_rules:
    project_name: { 
      type: 'categorical', 
      values: [
        'AghamYaman Labs Project', 'DepEd Lingap Labs Project', 'DepEd Likha-Agham Project',
        'Science Lab Enhancement Program', 'Laboratory Equipment Modernization', 'STEM Lab Development Initiative',
        'Chemistry Lab Upgrade Project', 'Physics Lab Equipment Procurement', 'Biology Lab Enhancement Program',
        'Science Education Modernization', 'Lab Safety Equipment Project', 'Science Equipment Replacement Program',
        'STEM Learning Center Development', 'Laboratory Infrastructure Upgrade', 'Science Lab Renovation Project'
      ] 
    }
    
    end_user_unit: { 
      type: 'categorical', 
      values: [
        'DEPED - Division of City Schools',
        'DEPED - Division of Provincial Schools',
        'DEPED - Science and Technology Education Center',
        'DEPED - Regional Science High School',
        'DEPED - National Science High School',
        'DEPED - Special Science Elementary School',
        'DEPED - Science and Technology School',
        'DEPED - Laboratory School',
        'DEPED - Science Education Center',
        'DEPED - STEM Learning Center'
      ] 
    }
    project_description: { type: 'faker', provider: 'catch_phrase' }
    
    # item_name is sourced from the item_source_file
    # !!! MAKE SURE TO USE LOG NORMAL FOR PRICE FIELDS to ensure positive values
    
    quantity: { type: 'log-normal', mean: 3, std_dev: 1 }
    unit_purchase_price: { type: 'log-normal', mean: 5.3, std_dev: 0.3 }
    average_price: { type: 'log-normal', mean: 5.35, std_dev: 0.25 }
    # approved_budget will be calculated as 15-22% above average_price

    procurement_method_name: { 
       type: 'categorical', 
       values: [
           'Competitive Bidding', 
           'Negotiated Procurement (Small Value Procurement)', 
           'Negotiated Procurement (Agency-to-Agency)', 
           'Repeat Order', 
           'Negotiated Procurement (Two Failed Biddings)', 
           'Direct Contracting'
       ], 
       weights: [0.66, 0.225, 0.075, 0.03, 0.005, 0.005] 
   }
    
    # Generate realistic business names for suppliers
    supplier: { type: 'faker', provider: 'company' }
    
    procurement_officer: { type: 'categorical', values: ['Jodi Marie Sta. Maria', 'Coco Martin Dela Cruz', 'Bea Alonzo Valera', 'Liza Soberano Reyes', 'Carlo Aquino Santos', 'Regine Velasquez Alcasid', 'John Lloyd Cruz Miranda', 'Anne Curtis Smith', 'Piolo Pascual Go', 'Nadine Lustre Panganiban'] }
    
    # invoice_number and payment_receipt_number are generated automatically
    
    # `transaction_date` is the only date field that needs to be configured.
    # The other five procurement timeline dates (e.g., bid_opening_date) are
    # generated automatically based on `transaction_date` and legal timelines.
    transaction_date: { type: 'date_range', start_date: '2022-01-01', end_date: '2024-12-31' }

  # ----------------------------------------------------------------------------
  # --- Anomaly Generation ---
  # This section defines which anomaly scenarios to use. The logic for each
  # scenario is defined as a Python class in `anomaly_definitions.py`.
  # The weights are taken from the class definitions in that file.
  # ----------------------------------------------------------------------------
  active_anomalies:
    # --- Pricing & Bidding Anomalies ---
    - "Suspicious Overpricing"      # Grossly overpriced items with non-competitive methods
    - "Bid Ceiling Collusion"       # Final price suspiciously close to approved budget
    - "Price Exceeds Budget"        # Contract price significantly higher than approved budget
    - "Budget Manipulation"         # Artificially inflated approved budget
    
    # --- Quantity & Scope Anomalies ---
    - "Unusual Bulk Order"          # Very large quantities under vague project names
    - "Contract Splitting"          # Project broken into smaller contracts to bypass bidding
    
    # --- Timeline & Date Anomalies ---
    - "End of Year Rush"            # Rushed transactions at fiscal year end
    - "Compressed Timeline"         # Unnaturally short procurement timelines
    - "Weekend Activity"            # Key events occurring on weekends
    - "Insufficient Bidding Period" # Less than legally required bidding period
    - "Delayed Award Notice"        # Award notice issued much later than legal timeframe
    - "Premature Contract Signing"  # Contract signed before award notice
    - "Backdated Documents"         # Logically inconsistent timeline dates
    - "Expedited Procurement"       # Extremely rushed procurement process
    - "Irregular Timeline Sequence" # Impossible timeline event sequence
    - "Multiple Timeline Violations" # Multiple violations simultaneously
    
    # --- Supplier & Method Anomalies ---
    - "Unjustified Direct Contracting" # Direct contracting for common goods
    - "Favored Supplier"            # Specific supplier consistently winning
    - "Fictitious Winner"           # Shell or non-existent company
    - "Supplier Monopoly"           # Single supplier with inside budget knowledge
    - "Method Misuse"               # Inappropriate procurement methods 