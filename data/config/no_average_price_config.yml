# ----------------------------------------------------------------------------
# CONFIGURATION FOR GENERATING DATA WITHOUT AVERAGE PRICE COLUMN
# ----------------------------------------------------------------------------
#
# This configuration demonstrates the 'none' mode for average_price.
# Use when average_price is not needed for analysis.
#
# ----------------------------------------------------------------------------

data_generator:
  # --- Main Configuration ---
  n_samples: 500
  random_state: 7
  anomaly_fraction: 0.03
  
  # --- Output Configuration ---
  output_folder: "generated_data_no_avg_price" 
  
  # --- Source for Item Descriptions ---
  item_source_file: "data/lab_equipment.txt"

  # --- Average Price Configuration ---
  # Mode: 'none' - No average_price column will be generated
  average_price:
    mode: 'none'

  # --- Rules for Generating Raw Transaction Fields ---
  field_rules:
    project_name: { type: 'categorical', values: ['AghamYaman Labs Project', 'DepEd Lingap Labs Project', 'DepEd Likha-Agham Project'] }
    end_user_unit: { type: 'fixed', value: 'DEPED - Division of City Schools' }
    project_description: { type: 'faker', provider: 'catch_phrase' }
    
    # Note: average_price is NOT included in field_rules when mode is 'none'
    # unit_purchase_price is ALWAYS required as fallback for approved_budget calculation
    quantity: { type: 'log-normal', mean: 3, std_dev: 1 }
    unit_purchase_price: { type: 'log-normal', mean: 5.3, std_dev: 0.3 }
    # approved_budget will be calculated as 15-22% above unit_purchase_price (no average_price fallback)

    procurement_method_name: { 
       type: 'categorical', 
       values: [
           'Competitive Bidding', 
           'Negotiated Procurement (Small Value Procurement)', 
           'Negotiated Procurement (Agency-to-Agency)', 
           'Repeat Order', 
           'Negotiated Procurement (Two Failed Biddings)', 
           'Direct Contracting'
       ], 
       weights: [0.66, 0.225, 0.075, 0.03, 0.005, 0.005] 
   }
    
    supplier: { type: 'categorical', values: ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D'], weights: [0.4, 0.3, 0.2, 0.1] }
    
    procurement_officer: { type: 'categorical', values: ['Jodi Marie Sta. Maria', 'Coco Martin Dela Cruz', 'Bea Alonzo Valera', 'Liza Soberano Reyes', 'Carlo Aquino Santos', 'Regine Velasquez Alcasid', 'John Lloyd Cruz Miranda', 'Anne Curtis Smith', 'Piolo Pascual Go', 'Nadine Lustre Panganiban'] }
    
    transaction_date: { type: 'date_range', start_date: '2022-01-01', end_date: '2024-12-31' }

  # --- Anomaly Generation ---
  active_anomalies:
    - "Suspicious Overpricing"
    - "Unusual Bulk Order"
    - "End of Year Rush"
    - "Compressed Timeline"
    - "Weekend Activity"
    - "Insufficient Bidding Period"
    - "Delayed Award Notice"
    - "Premature Contract Signing" 