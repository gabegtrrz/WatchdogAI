# Example YAML Configuration for Data Generator
data_generator:
  n_samples: 10000
  random_state: 42 # For reproducible results
  anomaly_fraction: 0.02 # 2% of records will be anomalies

  # --- Rules for generating features ---
  feature_rules:
    # Numerical feature generation
    unit_price: { type: 'normal', mean: 500, std_dev: 150 }
    quantity: { type: 'log-normal', mean: 4, std_dev: 1.5 }
    average_price: { type: 'normal', mean: 510, std_dev: 140 } # For calculating deviation

    # Categorical string generation
    procurement_method: { type: 'categorical', values: ['Public Bidding', 'Direct Contracting', 'Shopping'], weights: [0.7, 0.2, 0.1] }
    supplier: { type: 'categorical', values: ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D'], weights: [0.4, 0.3, 0.2, 0.1] }

    # Binary presence/absence simulation
    has_invoice: { type: 'binary', probability_of_one: 0.98 }
    has_description: { type: 'binary', probability_of_one: 0.80 }

  # --- Rules for injecting anomalies ---
  # These rules modify a normally generated record to make it anomalous.
  anomaly_rules:
    - { feature: 'quantity', type: 'extreme_value', factor: 25.0 }
    - { feature: 'price_deviation_ratio', type: 'extreme_value', factor: 12.0 }
    - { feature: 'is_weekend', type: 'fixed_value', value: 1 } # Force a transaction on a weekend
    - { feature: 'has_invoice', type: 'fixed_value', value: 0 } # Force a missing invoice 