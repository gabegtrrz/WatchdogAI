# ----------------------------------------------------------------------------
# CONFIGURATION FOR GENERATING NORMAL (NON-ANOMALOUS) DATA
# ----------------------------------------------------------------------------
#
# !! Has no average price field.
# This configuration is designed to generate a dataset containing ONLY NORMAL
# transactions. This is useful for training unsupervised models like
# Isolation Forest, which learn the profile of normal data in order to
# later identify deviations.
#
# The key is `anomaly_fraction: 0.0`.
#
# ----------------------------------------------------------------------------

data_generator:
  # --- Main Configuration ---
  n_samples: 100        
  random_state: 42          # Use a fixed state for reproducible training data.
  anomaly_fraction: 0.0    # Set to 0.0 so no anomalies are injected.
  
  # --- Output & Source Files ---
  output_folder: "normal_blank_average" # Descriptive output folder.
  item_source_file: "data/lab_equipment.txt"

  # ----------------------------------------------------------------------------
  # --- Field Generation Rules ---
  # ----------------------------------------------------------------------------
  field_rules:
    project_name: { type: 'categorical', values: ['AghamYaman Labs Project', 'DepEd Lingap Labs Project', 'DepEd Likha-Agham Project'] }

    end_user_unit: { type: 'fixed', value: 'DEPED - Division of City Schools' }

    project_description: { type: 'faker', provider: 'catch_phrase' }

    # !! MAKE SURE TO USE LOG NORMAL FOR PRICE FIELDS to ensure positive values
    quantity: { type: 'log-normal', mean: 3, std_dev: 1 }
    unit_purchase_price: { type: 'log-normal', mean: 5.3, std_dev: 0.3 }
    # !! Has no average price field.

    procurement_method_name: { 
       type: 'categorical', 
       values: [
           'Competitive Bidding', 
           'Negotiated Procurement (Small Value Procurement)', 
           'Negotiated Procurement (Agency-to-Agency)', 
           'Repeat Order', 
           'Negotiated Procurement (Two Failed Biddings)', 
           'Direct Contracting'
       ], 
       weights: [0.66, 0.225, 0.075, 0.03, 0.005, 0.005] 
   }

    supplier: { type: 'categorical', values: ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D'], weights: [0.4, 0.3, 0.2, 0.1] }

    procurement_officer: { type: 'categorical', values: ['Jodi Marie Sta. Maria', 'Coco Martin Dela Cruz', 'Bea Alonzo Valera', 'Liza Soberano Reyes', 'Carlo Aquino Santos', 'Regine Velasquez Alcasid', 'John Lloyd Cruz Miranda', 'Anne Curtis Smith', 'Piolo Pascual Go', 'Nadine Lustre Panganiban'] }

    transaction_date: { type: 'date_range', start_date: '2022-01-01', end_date: '2024-12-31' }

  # --- Anomaly Generation ---
  # This section is ignored when anomaly_fraction is 0.0, so tis left empty.
  active_anomalies: [] 