# Data source configuration
data_source:
  # Path to CSV file for evaluation (optional - will use database if not specified)
  # !! MAKE SURE TO USE ABSOLUTE PATH  AND **NO QUOTES**  csv_path: D:\Projects\WatchdogAI\data\training\training_data\14_0.05\labeled\eval.csv
  csv_path: D:\Projects\WatchdogAI\data\training\training_data\17_0.05\labeled\eval.csv
  # Database configuration (used if csv_path is not specified)
  database:
    use_database: false

# Model configuration
model:
  # Path to the trained model file (optional - uses default if not specified)
  # !! MAKE SURE TO USE ABSOLUTE PATH  AND **NO QUOTES**
  model_path: D:\Projects\WatchdogAI\data\training\models\iforest.joblib
  
  # Path to training columns file (optional - uses default if not specified)
  columns_path: D:\Projects\WatchdogAI\data\training\models\columns.joblib
  
  # Contamination parameter for evaluating Isolation Forest model (optional - uses model's default if not specified)
  # Range: 0.0 to 0.5 (0% to 50% of data expected to be anomalous)
  contamination: 0.05


# Evaluation configuration
evaluation:
  # Output format for evaluation results
  output_format: "both"  # Options: "json", "console", "both"
  
  # Evaluation log directory (will be created if it doesn't exist)
  log_directory: D:\Projects\WatchdogAI\data\evalutation\research_log
  
  # Include timestamp in log filename
  include_timestamp: true
  
  # Log filename format (optional - will use default if not specified)
  log_filename_format: "evaluation_{timestamp}.json"
  
  # Evaluation metrics to calculate
  metrics:
    - "precision"
    - "recall" 
    - "f1_score"
    - "accuracy"
    - "specificity"
    - "balanced_accuracy"
    - "confusion_matrix"
  
  # Detailed reporting options
  reporting:
    # Include dataset information in results
    include_dataset_info: true
    
    # Include model information in results
    include_model_info: true
    
    # Include prediction summary in results
    include_prediction_summary: true
    
    # Include confusion matrix in results
    include_confusion_matrix: true

# Logging configuration
logging:
  # Log level for evaluation process
  level: "INFO"  # Options: "DEBUG", "INFO", "WARNING", "ERROR"
  
  # Include console output during evaluation
  console_output: true
  
  # Include file logging during evaluation
  file_logging: false
  log_file_path: null

# Advanced configuration
advanced:
  # Handle missing columns in evaluation data
  handle_missing_columns: true
  
  # Default value for missing columns
  missing_column_default: 0
  
  # Remove extra columns not used in training
  remove_extra_columns: true
  
  # Validate data before evaluation
  validate_data: true
  
  # Continue evaluation even if some metrics fail
  continue_on_metric_error: false 