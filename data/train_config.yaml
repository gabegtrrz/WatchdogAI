# Purpose: To generate a large dataset for training the anomaly detection model.

data_generator:
  n_samples: 10000
  random_state: 42 # Ensures the training dataset is always the same
  anomaly_fraction: 0.02 # 2% of the data will be anomalous

  # --- Rules for generating the baseline features ---
  feature_rules:
    # Numerical features representing prices and quantities
    unit_price: { type: 'normal', mean: 500, std_dev: 150 }
    average_price: { type: 'normal', mean: 510, std_dev: 140 }
    quantity: { type: 'log-normal', mean: 4, std_dev: 1.5 }

    # Categorical feature for different suppliers
    supplier: 
      type: 'categorical'
      values: ['Supplier A', 'Supplier B', 'Supplier C', 'Supplier D']
      weights: [0.4, 0.3, 0.2, 0.1]

    # Binary feature to simulate the presence of an invoice
    has_invoice: { type: 'binary', probability_of_one: 0.98 }

  # --- Rules for injecting common anomalies ---
  # These anomalies represent typical red flags.
  anomaly_rules:
    # Rule 1: A transaction with an extremely high price.
    - { feature: 'unit_price', type: 'extreme_value', factor: 15.0 }
    
    # Rule 2: A transaction with an unusually large quantity.
    - { feature: 'quantity', type: 'extreme_value', factor: 20.0 }