# Test Grid Search Configuration
# Minimal configuration for testing the grid search functionality

data_source:
  training_csv_path: "data/grid_search/dataset/21_0.05/labeled/training.csv"
  validation_csv_path: "data/grid_search/dataset/21_0.05/labeled/eval.csv"

grid_search:
  # Minimal hyperparameter combinations for testing
  hyperparameters:
    contamination: [0.05, 0.1]
    n_estimators: [50, 100]
    max_samples: ["auto"]
    bootstrap: [False]
    random_state: [42]

output:
  results_dir: "data/grid_search/results"
  # Optional: Custom filename for test results
  results_filename: "test_grid_search_{timestamp}.json" 