# Grid Search Configuration for Isolation Forest Optimization
# Simple configuration for grid search hyperparameter testing

data_source:
  # Paths to training and validation datasets
  training_csv_path: "data/grid_search/dataset/21_0.05/unlabeled/training.csv"
  validation_csv_path: "data/grid_search/dataset/21_0.05/labeled/eval.csv"

grid_search:
  # Define hyperparameters to test - all combinations will be evaluated
  hyperparameters:
    contamination: [0.01, 0.02, 0.03, 0.05, 0.1, 0.15, 0.2]
    n_estimators: [50, 100, 200]
    max_samples: [1.00, 0.5, 0.8]
    bootstrap: [False]
    random_state: [7,42, 77]
  # Enable/disable AUC calculation (default: true)
  calculate_auc: true

output:
  # Output configuration
  results_dir: "data/grid_search/results"
  # Optional: Custom filename (use {timestamp} for dynamic timestamp)
  results_filename: "grid_search_results_{timestamp}.json" 