# USAGE:
# python watchdog_ai/manage.py train_model --config path/to/your/config.yml

# Data source configuration
data_source:
  # Use CSV file with labeled data for research mode
  # !! MAKE SURE TO USE ABSOLUTE PATH  AND **NO QUOTES**
  csv_path: D:\Projects\WatchdogAI\data\training\training_data\16_0.05\labeled\training.csv
  
  actual_contamination: 0.05

# Model configuration
model:
  # Required: Range of contamination values to test
  contamination_range: [0.05]
  
  # Optional:Isolation Forest parameters
  n_estimators: 100 # n_estimators specifies the number of individual trees to build in the forest.
  random_state: 10
  max_samples: 700
  bootstrap: false
  n_jobs: null
  verbose: 0
  warm_start: false
  max_features: 1.0 

  # You can set its value in a couple of ways:
      # As an integer: This specifies the exact number of features to draw. For example, max_features=5 means five features will be randomly selected at each split.

      # As a float (percentage): This specifies the proportion of the total features to draw. For example, max_features=0.5 means 50% of the features will be randomly selected at each split.

      # The default value in many libraries, like scikit-learn, is 1.0, which means all features are considered at every split.
  

# Training configuration
training:
  # Enable research mode with cross-validation
  research_mode: false
  actual_contamination:

# Output configuration - save to custom directory for experimeent 18
output:
  model_path: 'D:/Projects/WatchdogAI/watchdog_ai/apps/ai_analytics/model_files/iforest.joblib'

  columns_path: 'D:/Projects/WatchdogAI/watchdog_ai/apps/ai_analytics/model_files/columns.joblib'

  research_log_path: 'D:/Projects/WatchdogAI/data/training/results/training_results.json'

  # Option 1: Specify a custom model directory (relative to BASE_DIR)
  # model_dir: 'custom_models/anomaly_detection'
  
  # Option 2: Specify individual file names (will be saved in model_dir)
  # model_filename: 'isolation_forest_v2.joblib'
  # columns_filename: 'training_columns_v2.joblib'
  # research_log_filename: 'training_results_v2.json'
  
  # Option 3: Specify absolute paths for individual files
  # model_path: '/absolute/path/to/model.joblib'
  # columns_path: '/absolute/path/to/columns.joblib'
  # research_log_path: '/absolute/path/to/results.json'