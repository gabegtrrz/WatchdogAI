# USAGE:
# python watchdog_ai/manage.py train_model --config path/to/your/config.yml

# Data source configuration
data_source:
  # Use CSV file with labeled data for research mode
  csv_path: data\training_data\7\transactions_with_labels.csv

# Model configuration
model:
  # Test multiple contamination values in research mode
  contamination_range: [0.18, 0.19, 0.20, 0.21, 0.25]
  # Isolation Forest parameters
  n_estimators: 300
  random_state: 7
  max_samples: 500
  bootstrap: false
  n_jobs: null
  verbose: 0
  warm_start: false
  max_features: 1.0

# Training configuration
training:
  # Enable research mode with cross-validation
  research_mode: true